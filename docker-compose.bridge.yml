services:
  homesphere:
    depends_on:
      - media-bridge

  media-bridge:
    # 冻结的 QMediaSync v0.14.23。
    # 安装/更新脚本保证本地镜像 homesphere-qms:v0.14.23-frozen 存在，
    # 因此运行时不依赖 qicfan/qmediasync 仓库或 Docker Hub 持续可用。
    image: ${QMS_IMAGE:-homesphere-qms:v0.14.23-frozen}
    pull_policy: never
    container_name: media-bridge
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      qms-postgres:
        condition: service_healthy
    # 管理页面仅监听 VPS 本机；由现有 Cloudflare Tunnel + Access 发布，不直接暴露公网。
    ports:
      - "127.0.0.1:12333:12333"
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:12333/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./bridge-config:/app/config
      - ./media:/media

  qms-postgres:
    image: postgres:15-alpine
    container_name: qms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${QMS_POSTGRES_DB:-qmediasync}
      POSTGRES_USER: ${QMS_POSTGRES_USER:-qmediasync}
      POSTGRES_PASSWORD: ${QMS_POSTGRES_PASSWORD:?请在 .env 中设置 QMS_POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    # 1C / 1GB VPS 的保守参数；QMediaSync 为小规模家庭 STRM 场景。
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - jit=off
    shm_size: 64mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - qms-postgres-data:/var/lib/postgresql/data

volumes:
  qms-postgres-data:
