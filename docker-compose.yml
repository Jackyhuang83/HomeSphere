services:
  onehubx-movies:
    build: .
    image: ${ONEHUBX_IMAGE:-onehubx-movies:dev}
    container_name: onehubx-movies
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - onehubx-data:/data
    environment:
      - PASSWORD=${PASSWORD:?请在 .env 中设置 PASSWORD}
      - PROXY_SECRET=${PROXY_SECRET:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-}
      - ONEHUBX_DATA_DIR=/data
      - ONEHUBX_115_COOKIE=${ONEHUBX_115_COOKIE:-}
      - ONEHUBX_115_MEDIA_DIRS=${ONEHUBX_115_MEDIA_DIRS:-[]}
      - ONEHUBX_115_MAX_CONCURRENT=${ONEHUBX_115_MAX_CONCURRENT:-1}
      - ONEHUBX_115_MAX_RPS=${ONEHUBX_115_MAX_RPS:-1}
      - ONEHUBX_115_RETRIES=${ONEHUBX_115_RETRIES:-2}
      - ONEHUBX_115_TIMEOUT_MS=${ONEHUBX_115_TIMEOUT_MS:-12000}
      - ONEHUBX_SYNC_MAX_FILES=${ONEHUBX_SYNC_MAX_FILES:-20000}
      - TMDB_API_TOKEN=${TMDB_API_TOKEN:-}
      - TMDB_LANGUAGE=${TMDB_LANGUAGE:-zh-CN}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-8000}
      - MAX_RETRIES=${MAX_RETRIES:-1}
      - DEBUG=${DEBUG:-false}
      # 以下继续兼容 LibreTV 的推荐 / IPTV 配置
      - DEFAULT_LIVE_SOURCES=${DEFAULT_LIVE_SOURCES:-}
      - DEFAULT_SUBSCRIPTIONS=${DEFAULT_SUBSCRIPTIONS:-}
      - LIVE_ALLOW_PRIVATE=${LIVE_ALLOW_PRIVATE:-}
      - 60S_API_BASE=${60S_API_BASE:-}

volumes:
  onehubx-data:
