services:
  homesphere:
    build: .
    image: ${HOMESPHERE_IMAGE:-ghcr.io/jackyhuang83/homesphere:latest}
    container_name: homesphere
    restart: unless-stopped
    ports:
      - "8080:8080"
    # 访问按官方 host-network 方式运行的 CloudDrive2；不会开放新端口。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PASSWORD: ${PASSWORD:?请在 .env 中设置 PASSWORD}
      PROXY_SECRET: ${PROXY_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-8000}
      MAX_RETRIES: ${MAX_RETRIES:-1}
      SIXTYS_API_BASE: ${SIXTYS_API_BASE:-}
      DEFAULT_LIVE_SOURCES: ${DEFAULT_LIVE_SOURCES:-}
      LIVE_ALLOW_PRIVATE: ${LIVE_ALLOW_PRIVATE:-}
      HOMESPHERE_DATA_DIR: /data
      HOMESPHERE_LIBRARY_MODE: ${HOMESPHERE_LIBRARY_MODE:-strm}
      HOMESPHERE_STRM_ROOT: /media
      HOMESPHERE_STRM_PLAYBACK_MODE: ${HOMESPHERE_STRM_PLAYBACK_MODE:-resolve}
      HOMESPHERE_STRM_ALLOWED_HOSTS: ${HOMESPHERE_STRM_ALLOWED_HOSTS:-media-bridge}
      HOMESPHERE_BRIDGE_TIMEOUT_MS: ${HOMESPHERE_BRIDGE_TIMEOUT_MS:-12000}
      HOMESPHERE_BRIDGE_MAX_REDIRECTS: ${HOMESPHERE_BRIDGE_MAX_REDIRECTS:-3}
      HOMESPHERE_CD2_ENDPOINT: ${HOMESPHERE_CD2_ENDPOINT:-}
      HOMESPHERE_CD2_TOKEN: ${HOMESPHERE_CD2_TOKEN:-}
      HOMESPHERE_CD2_PROBE_PATH: ${HOMESPHERE_CD2_PROBE_PATH:-}
      HOMESPHERE_CD2_TIMEOUT_MS: ${HOMESPHERE_CD2_TIMEOUT_MS:-8000}
      HOMESPHERE_115_COOKIE: ${HOMESPHERE_115_COOKIE:-}
      HOMESPHERE_115_MEDIA_DIRS: ${HOMESPHERE_115_MEDIA_DIRS:-}
      HOMESPHERE_115_MIN_INTERVAL_MS: ${HOMESPHERE_115_MIN_INTERVAL_MS:-500}
      HOMESPHERE_115_TIMEOUT_MS: ${HOMESPHERE_115_TIMEOUT_MS:-15000}
      HOMESPHERE_SYNC_MAX_ENTRIES: ${HOMESPHERE_SYNC_MAX_ENTRIES:-30000}
      HOMESPHERE_SYNC_MAX_DIRS: ${HOMESPHERE_SYNC_MAX_DIRS:-5000}
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-zh-CN}
    volumes:
      - homesphere-data:/data
      - ${HOMESPHERE_STRM_PATH:-./media}:/media:ro

volumes:
  homesphere-data:
