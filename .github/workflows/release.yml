name: Release HomeSphere

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'CHANGELOG.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homesphere-stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "Prerelease version $VERSION: skip stable GitHub Release."
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release notes
        if: steps.version.outputs.stable == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          grep -Fq "## v$VERSION " CHANGELOG.md

      - name: Prepare release notes
        if: steps.version.outputs.stable == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          awk -v heading="## v$VERSION " '
            index($0, heading) == 1 { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish GitHub Release
        if: steps.version.outputs.stable == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "HomeSphere $TAG" \
            --notes-file release-notes.md
