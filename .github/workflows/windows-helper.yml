name: Build Windows Player Helper

on:
  push:
    branches:
      - main
    paths:
      - 'windows-helper/**'
      - 'scripts/install-windows-helper.ps1'
      - '.github/workflows/windows-helper.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-helper-latest
  cancel-in-progress: true

env:
  RELEASE_TAG: windows-helper-latest
  ASSET: HomeSpherePlayerHelper.exe

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: windows-helper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: windows-helper/go.mod

      - name: Test helper
        run: go test ./...

      - name: Build Windows x64 helper
        shell: pwsh
        run: |
          $sha = '${{ github.sha }}'.Substring(0, 7)
          go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=$sha" -o "../$env:ASSET" .

      - name: Create SHA256
        working-directory: .
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "$env:ASSET").Hash.ToLowerInvariant()
          "$hash  $env:ASSET" | Set-Content -NoNewline "$env:ASSET.sha256"

      - name: Publish latest helper release
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          cat > windows-helper-release-notes.md <<EOF
          # HomeSphere Windows Player Helper

          This helper enables HomeSphere HLS playback in Windows Chrome/Edge without sending video bytes through the VPS.

          Security properties:
          - binds only to 127.0.0.1:17865
          - proxies only HTTPS resources on 115.com / *.115.com
          - stores no 115 access token
          - intended for HomeSphere's local browser playback path
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ASSET" "$ASSET.sha256" --clobber
            gh release edit "$RELEASE_TAG"               --title "HomeSphere Windows Player Helper"               --notes-file windows-helper-release-notes.md
          else
            gh release create "$RELEASE_TAG" "$ASSET" "$ASSET.sha256"               --title "HomeSphere Windows Player Helper"               --notes-file windows-helper-release-notes.md
          fi
