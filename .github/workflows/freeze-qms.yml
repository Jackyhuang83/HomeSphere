name: Freeze QMediaSync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/freeze-qms.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: freeze-qmediasync-v0.14.23
  cancel-in-progress: false

env:
  QMS_VERSION: v0.14.23
  QMS_COMMIT: 8219d92607982b2405c7c4bfb645f8f1d6ff3bf6
  SOURCE_IMAGE: qicfan/qmediasync:v0.14.23
  TARGET_IMAGE: ghcr.io/${{ github.repository_owner }}/homesphere:qms-v0.14.23-frozen
  RELEASE_TAG: qms-v0.14.23-frozen

jobs:
  freeze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror verified QMediaSync image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull --platform linux/amd64 "$SOURCE_IMAGE"
          SOURCE_DIGEST="$(docker image inspect "$SOURCE_IMAGE" --format '{{join .RepoDigests "\n"}}' | grep '^qicfan/qmediasync@sha256:' | head -n1)"
          test -n "$SOURCE_DIGEST"
          docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"
          docker push "$TARGET_IMAGE"
          printf '%s\n' "$SOURCE_DIGEST" > /tmp/qms-source-digest.txt

      - name: Archive corresponding source
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 3 \
            "https://github.com/qicfan/qmediasync/archive/${QMS_COMMIT}.tar.gz" \
            -o "qmediasync-${QMS_VERSION}-source.tar.gz"
          test -s "qmediasync-${QMS_VERSION}-source.tar.gz"

          SOURCE_DIGEST="$(cat /tmp/qms-source-digest.txt)"
          cat > qmediasync-freeze-notes.md <<EOF
          # QMediaSync frozen dependency

          HomeSphere verified this QMediaSync release in the 115 STRM/HLS playback path before freezing it.

          - Upstream version: `${QMS_VERSION}`
          - Upstream source commit: `${QMS_COMMIT}`
          - Upstream image: `${SOURCE_IMAGE}`
          - Upstream pulled digest: `${SOURCE_DIGEST}`
          - Frozen HomeSphere image: `${TARGET_IMAGE}`
          - Platform: `linux/amd64`
          - Upstream license: GPL-3.0

          This release preserves the corresponding upstream source snapshot together with the mirrored runtime image reference. HomeSphere does not automatically follow future QMediaSync releases.
          EOF

      - name: Publish source snapshot release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "qmediasync-${QMS_VERSION}-source.tar.gz" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --title "Frozen QMediaSync ${QMS_VERSION}" \
              --notes-file qmediasync-freeze-notes.md
          else
            gh release create "$RELEASE_TAG" \
              "qmediasync-${QMS_VERSION}-source.tar.gz" \
              --title "Frozen QMediaSync ${QMS_VERSION}" \
              --notes-file qmediasync-freeze-notes.md
          fi
